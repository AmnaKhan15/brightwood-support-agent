<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brightwood Goods</title>
<meta name="description" content="Brightwood Goods is a fictional home goods store with a working AI support assistant.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="bar">
  <a class="logo" href="#/"><i></i><span>Brightwood</span></a>
  <nav class="nav" id="nav" aria-label="Main">
    <a href="#/" data-r="">Shop</a><a href="#/orders" data-r="orders">Your orders</a><a href="#/help" data-r="help">Help centre</a>
    <a href="#/inside" data-r="inside">How it works</a>
  </nav>
  <span class="staff-tag" id="staffTag"><b>Brightwood Staff</b> <span class="pill n">internal</span></span>
  <div class="spacer"></div>
  <a class="btn ghost sm staff-only" href="#/" id="backToStore">Back to the store</a>
  <label class="who" for="who">Signed in as <select id="who" aria-label="Signed-in customer"></select></label>
  <button class="btn ghost sm" id="reset" type="button" title="Start over with fresh orders">Reset</button>
  <button class="btn ghost icon-btn" id="theme" type="button" aria-label="Switch light and dark theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>
<main id="view" class="wrap" tabindex="-1"></main>

<button class="fab" id="fab" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>Ask support</button>
<section class="chatwin" id="chat" hidden aria-label="Support chat">
  <div class="chat-head"><div class="av">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="7" width="16" height="12" rx="4"/><path d="M12 7V4M9 13h.01M15 13h.01"/></svg></div>
    <div style="flex:1;min-width:0"><b>Brightwood support</b><small id="chatSub">AI assistant</small></div>
    <button id="speakToggle" type="button" aria-pressed="false" title="Read answers aloud">Voice: off</button><button id="openInspector" type="button">Behind the scenes</button><button id="closeChat" type="button" aria-label="Close chat">✕</button></div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <div class="voice-note" id="voiceNote" hidden></div>
  <form class="compose" id="form"><button class="btn ghost icon-btn mic" id="mic" type="button" aria-label="Speak your message" aria-pressed="false" title="Speak your message"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><input class="field" id="msg" maxlength="500" autocomplete="off" placeholder="Ask about an order, a return or a refund" aria-label="Message"><button class="btn solid sm" type="submit" id="send">Send</button></form>
</section>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Behind the scenes">
  <header><div style="flex:1"><div class="eyebrow">Behind the scenes</div><h2 style="font-size:1.25rem">What happened to your message</h2></div><button class="btn ghost icon-btn" id="closeDrawer" type="button" aria-label="Close">✕</button></header>
  <div class="tabs" id="dtabs" role="tablist"></div>
  <div class="body" id="dbody"></div>
</aside>
<script src="/app.js"></script>
</body>
</html>
