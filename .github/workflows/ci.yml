name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-mcp.txt
      - run: PYTHONPATH=src python -m unittest discover -q
      - name: Agent scenarios (the gate must hold)
        run: PYTHONPATH=src python -m brightwood_support.agent_eval
      - name: Retrieval quality gate
        run: PYTHONPATH=src python evals/run_retrieval_eval.py
