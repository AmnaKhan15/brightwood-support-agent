name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: src
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-mcp.txt "httpx>=0.28,<1" "ruff>=0.17" "openevals>=0.2,<1"
      - name: Lint
        run: ruff check src tests evals finetune
      - name: Unit and Postgres integration tests
        run: python -m unittest discover -v
      - name: Agent safety scenarios (single and multi-agent; the gate must hold)
        run: python -m brightwood_support.agent_eval
      - name: Conversation evals (offline assistant, code checks)
        run: python evals/run_conversation_eval.py --min-pass 0.95
      - name: Retrieval quality gate
        run: python evals/run_retrieval_eval.py
      - name: Fine-tuning pipeline (dry run)
        run: python finetune/build_dataset.py --dry-run --limit 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t brightwood-api .
      - name: Smoke test the image
        run: |
          docker run -d -p 8000:8000 -e DEMO_STAFF_LOGIN=true --name api brightwood-api
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && exit 0; sleep 2; done
          docker logs api; exit 1

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate
